<meta charset="utf-8">

{% include seo.html %}

{% unless site.atom_feed.hide %}
  <link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
{% endunless %}

{%- comment %} https://docs.google.com/presentation/d/1rmxwWa9P6_xHqonmh5ONXRS-jPc5XKbnv99Rjkhe04s/present {% endcomment -%}
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  {% if site.enable_copy_code_button -%}
    window.enable_copy_code_button = true;
  {%- endif %}
</script>

<!-- For all browsers -->
<link id="theme-light" rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link id="theme-dark" rel="stylesheet" href="{{ '/assets/css/dark.css' | relative_url }}" media="not all">
<script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-dark').setAttribute('media', 'all');
      }
    } catch (e) {}
  })();
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var icon = btn.querySelector('i');
    function apply(dark) {
      if (dark) { document.documentElement.setAttribute('data-theme', 'dark'); }
      else { document.documentElement.removeAttribute('data-theme'); }
      document.getElementById('theme-dark').setAttribute('media', dark ? 'all' : 'not all');
      if (icon) { icon.className = dark ? 'fas fa-sun' : 'fas fa-moon'; }
      try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    }
    if (icon) { icon.className = document.documentElement.getAttribute('data-theme') === 'dark' ? 'fas fa-sun' : 'fas fa-moon'; }
    btn.addEventListener('click', function () {
      apply(document.documentElement.getAttribute('data-theme') !== 'dark');
    });
  });
</script>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css"></noscript>

{% if site.head_scripts %}
  {% for script in site.head_scripts %}
    <script src="{{ script | relative_url }}"></script>
  {% endfor %}
{% endif %}
